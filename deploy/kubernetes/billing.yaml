# A generic example: the API + web UI (2 replicas) and the worker (1 replica).
# Replace billing.example.com, the image tag and the Ingress class for your
# cluster. Create the Secret first (see README.md) and run migrate-job.yaml on
# every release before rolling these out.
apiVersion: v1
kind: Namespace
metadata:
  name: billing
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-api
  namespace: billing
  labels: { app.kubernetes.io/name: billing, app.kubernetes.io/component: api }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: billing, app.kubernetes.io/component: api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: billing, app.kubernetes.io/component: api }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 65532, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: api
          image: ghcr.io/orshih6/billing:v0.1.0
          args: ["serve"]
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: APP_ENV, value: production }
            - { name: PUBLIC_URL, value: https://billing.example.com }
            - { name: WORKER_ENABLED, value: "false" }
            - { name: LOG_JSON, value: "true" }
          envFrom: [{ secretRef: { name: billing-secrets } }]
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 20 }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 256Mi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-worker
  namespace: billing
  labels: { app.kubernetes.io/name: billing, app.kubernetes.io/component: worker }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: billing, app.kubernetes.io/component: worker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: billing, app.kubernetes.io/component: worker }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 65532, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: worker
          image: ghcr.io/orshih6/billing:v0.1.0
          args: ["worker"]
          env:
            - { name: APP_ENV, value: production }
            - { name: PUBLIC_URL, value: https://billing.example.com }
            - { name: LOG_JSON, value: "true" }
          envFrom: [{ secretRef: { name: billing-secrets } }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          resources: { requests: { cpu: 20m, memory: 48Mi }, limits: { memory: 192Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: billing-api
  namespace: billing
spec:
  selector: { app.kubernetes.io/name: billing, app.kubernetes.io/component: api }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: billing
  namespace: billing
spec:
  ingressClassName: nginx
  tls: [{ hosts: [billing.example.com], secretName: billing-tls }]
  rules:
    - host: billing.example.com
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: billing-api, port: { number: 8080 } } } }
